pipeline:
  weather: false                # pas de variantes météo : le serveur VEAF fixe météo et heure (David, 12/10/2026)

# ── Profils de build ─────────────────────────────────────────────────────────
# Par défaut = serveur VEAF : sécurité active, logs info, une seule mission (la météo est celle du serveur).
# `veaf-tools build --profile LOCAL_TEST` : test local rapide.
profiles:
  LOCAL_TEST:
    global_log_level: debug
    security:
      disabled: true
    mission:
      hide_names_from_spawned_groups: false
cap_missions:
  - group_name: CAP-Qeshm-MiG29
    menu_name: CAP rouge MiG-29 (Fox 1) — Qeshm — FL220
    briefing: "Deux MiG-29A armés de R-27R et R-73 patrouillent au-dessus de l'île de Qeshm, au FL220. Emport : R-73*4,R-27R*2,Fuel-1500."
  - group_name: CAP-Lengeh-F4
    menu_name: CAP rouge F-4E (Fox 1) — Bandar Lengeh — FL200
    briefing: "Deux F-4E armés d'AIM-7 et d'AIM-9 patrouillent au-dessus de Bandar Lengeh et de Kong, au FL200. Emport : AIM-9*4,AIM-7*4,Fuel*2."
  - group_name: CAP-Lar-F14
    menu_name: CAP rouge F-14A (intercepteur haut et rapide, AIM-54) — Lar — FL350
    briefing: 'Deux F-14A armés de Phoenix patrouillent haut et vite au-dessus de Lar, au FL350. Emport : AIM-54C*4,AIM-9*2,AIM-7*2.'
  - group_name: Raid-Kish-Su24
    menu_name: Raid rouge Su-24M à intercepter — Kish — FL150
    briefing: 'Deux Su-24M chargés de bombes tournent au-dessus de Kish, au FL150, prêts à frapper Sir Abu Nuayr : les intercepter. Emport : FAB-500*4,R-60M*2.'
  - group_name: CAP-RAK-F16
    menu_name: CAP bleue F-16 (Fox 3) — Ras Al Khaimah — FL220
    briefing: 'Deux F-16C patrouillent au-dessus de Ras Al Khaimah et de la base de Musandam, au FL220. Emport : AIM-120C*4, AIM-9M*2, Fuel.'
  - group_name: CAP-AbuDhabi-M2000
    menu_name: CAP bleue Mirage 2000-5 (Fox 3) — Abu Dhabi — FL250
    briefing: "Deux Mirage 2000-5 émiriens couvrent la côte d'Abu Dhabi, au FL250. Emport : R 550*2,MICA AR*4,Fuel*3."

# ── Missions scénarisées (module COMBATMISSION) — écrites par tools/gen_11_config.py ──
combat_missions:
  - name: Defense-AlMinhad
    friendly_name: Défense — raid iranien sur Al Minhad
    secured: false
    briefing: "Deux Su-24M armés de missiles antiradar ouvrent la route à quatre F-4E chargés de bombes, escortés de deux F-14A, partis de Qeshm vers Al Minhad. Abattez les bombardiers avant le largage.\nÉchec si la base est bombardée (constaté par vous : la mission ne le vérifie pas)."
    elements:
      - name: SEAD
        groups:
          - SC-Defense-AlMinhad-SEAD
        scalable: false
